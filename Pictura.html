function buildCells() {
  const rowWidths = ROWS.map(row => {
    const w = row.width ?? row.size;
    let total = row.count * w;
    for (let i = 0; i < row.count - 1; i++) total += row.gaps?.[i] ?? H_GAP;
    return total;
  });
  const heartWidth = Math.max(...rowWidths);
  let y = 0, id = 0;
  const cells = [];
  for (let r = 0; r < ROWS.length; r++) {
    const row = ROWS[r];
    const w = row.width ?? row.size, ch = row.size;
    const rowW = rowWidths[r];
    let x = (heartWidth - rowW) / 2;
    for (let c = 0; c < row.count; c++) {
      const seed = (r * 131 + c * 17 + 7) * 9301;
      const rand = (n) => { const v = Math.sin(seed + n) * 43758.5453; return v - Math.floor(v); };
      const angle = rand(1) * Math.PI * 2;
      const dist = 420 + rand(2) * 400;
      cells.push({
        id, row: r, col: c, rowCount: row.count, x, y, w, h: ch,
        scatterX: Math.cos(angle) * dist, scatterY: Math.sin(angle) * dist * 0.7,
        img: PERSON_IMAGES[id % PERSON_IMAGES.length],
      });
      id++;
      x += w + (row.gaps?.[c] ?? H_GAP);
    }
    y += ch + V_GAP;
  }
  return { cells, heartWidth, heartHeight: y - V_GAP };
}

        const exit = Math.min(1, bottom / (vh * 0.4));
        el.style.transform = `scale(${Math.max(0, Math.min(enter, exit)).toFixed(3)})`;
      });
      // Gallery bg video: zoom in as you scroll through the section
      if (this._galleryVideo && this._gallerySection) {
        const rect = this._gallerySection.getBoundingClientRect();
        const total = rect.height + vh;
        const p = Math.max(0, Math.min(1, (vh - rect.top) / total));
        this._galleryVideo.style.transform = `scale(${(1 + p * 0.45).toFixed(4)})`;
      }
      this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);

    // Pallet section mounts only after the splash reveals the app; poll for it.
    this._palletPoll = setInterval(() => {
      if (this._palletEl && !this._palletInit) { this._initPallet(); clearInterval(this._palletPoll); this._palletPoll = null; }
    }, 120);

    window.removeEventListener("blur", this._onLeave);
    cancelAnimationFrame(this._raf);
    if (this._interval) clearInterval(this._interval);
    clearTimeout(this._linesT);
    clearTimeout(this._splashT1); clearTimeout(this._splashT2); clearTimeout(this._splashMaxT);

  _initPallet() {
    if (this._palletInit || !this._palletEl) return;
    {
      this._palletInit = true;
      this._measurePallet();
      this._palletMeasureT = setTimeout(this._measurePallet, 300);
      if (typeof ResizeObserver !== "undefined") {
        this._palletRO = new ResizeObserver(this._measurePallet);
        this._palletRO.observe(this._palletEl);
      }
      this._palletIO = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          if (e.target === this._palletSec1El) this.setState({ palletHeroSeen: true });
          if (e.target === this._palletSec2El) this.setState({ sec2Seen: true });
          if (e.target === this._palletSec3El) { this.setState({ sec3Seen: true }); this._startBanner(); }
        });
      }, { threshold: 0.2 });
      [this._palletSec1El, this._palletSec2El, this._palletSec3El].forEach((el) => el && this._palletIO.observe(el));
      this._palletContainerIO = new IntersectionObserver((es) => {
        this.setState({ palletInView: es[0].isIntersecting });
      }, { rootMargin: "10% 0px 10% 0px" });
      this._palletContainerIO.observe(this._palletEl);
      this._onScrollFx();

  _measurePallet = () => {
    const el = this._palletEl;
    if (!el) return;
    let top = 0, n = el;
    while (n) { top += n.offsetTop; n = n.offsetParent; }
    const vh = window.innerHeight;
    const scrollable = Math.max(1, el.offsetHeight - vh);
    let s2 = 0, m = this._palletSec2El;
    while (m) { s2 += m.offsetTop; m = m.offsetParent; }
    this._palletTop = top;
    this._palletScrollable = scrollable;
    this._palletLp = Math.min(0.99, Math.max(0.05, (s2 - top) / scrollable));
  };

    if (this._bannerInterval) return;
    this._bannerInterval = setInterval(() => this.setState((s) => ({ palletSlide: (s.palletSlide + 1) % PALLET_BANNERS.length })), 3000);
  };

  renderPalletCards() {
    const vp = this.state.vp;
    const lp = this._palletLp || 0.5;
    const scrollable = this._palletScrollable || vp.h * 2;
    const cp = Math.min(this.state.palletProgress, lp);
    const isLocked = this.state.palletProgress >= lp;
    const HERO_ROW_Y = 522;
    const stackCx = vp.w / 2, stackCy = vp.h / 2;
    const cascadeLeftRef = vp.w * 0.4;
    const p1 = lp * 0.33, p2 = lp * 0.66;
    const wrapperStyle = isLocked
      ? { position: "absolute", top: lp * scrollable, left: 0, width: "100%", height: vp.h, zIndex: 5, pointerEvents: "none" }
      : { position: "fixed", inset: 0, zIndex: 5, pointerEvents: "none" };
    return h("div", { style: wrapperStyle },
      FAN_SLOTS.map((slot, i) => {
        const cas = CASCADE[i];
        const s1Cx = vp.w / 2 + slot.x, s1Cy = HERO_ROW_Y + slot.y;
        const s2Cx = cascadeLeftRef + cas.left + 110, s2Cy = cas.top + 110;
        const cx = interp(cp, [0, p1, p2, lp], [s1Cx, stackCx, stackCx, s2Cx]);
        const cy = interp(cp, [0, p1, p2, lp], [s1Cy, stackCy, s2Cy, s2Cy]);
        const rot = interp(cp, [0, p1, lp], [slot.rotate, 0, cas.rotate]);
        const sc = interp(cp, [0, p1, lp], [slot.scale, 1, 1]);
        const hovered = this.state.palletHover === i;
        return h("div", { key: "pc" + i,
          onMouseEnter: () => this.setState({ palletHover: i }),
          onMouseLeave: () => this.setState({ palletHover: null }),
          style: { position: "absolute", top: 0, left: 0, width: 220, height: 220, borderRadius: 18, overflow: "hidden",
            boxShadow: "0 20px 60px rgba(0,0,0,0.20)", background: "#111",
            transform: `translate(${cx}px, ${cy}px) translate(-50%, -50%) rotate(${rot}deg) scale(${sc})`,
            transformOrigin: "center", zIndex: hovered ? 30 : cas.z, opacity: 0,
            animation: "palletCardIn 0.6s ease-out forwards", animationDelay: `${0.3 + i * 0.08}s`,
            pointerEvents: "auto", cursor: "pointer" } },
          h("img", { src: PALLET_CARDS[i], alt: "", draggable: false, style: { width: "100%", height: "100%", objectFit: "cover", display: "block" } })
        );

  _parallaxConfig() {
    const areas = this.cells.map(c => c.w * c.h);
    const minA = Math.min(...areas), maxA = Math.max(...areas);
    const map = new Map();
    this.cells.forEach(c => {
      const a = c.w * c.h;
      const t = (a - minA) / (maxA - minA || 1);
      const base = 35 - t * 30;
      const hh = Math.sin(c.id * 12.9898) * 43758.5453;
      const r1 = hh - Math.floor(hh);
      const r2raw = Math.sin(c.id * 78.233) * 43758.5453;
      const r2 = r2raw - Math.floor(r2raw);
      map.set(c.id, { mx: base * (0.75 + r1*0.5), my: base * (0.75 + r2*0.5) });
    });
    return map;
  }

  scrollToSection = (key) => {
    this.setState({ menuOpen: false });
    const map = { home: 0, work: this._gallerySection, thelab: this._palletEl, pricing: this._pricingEl, contact: this._footerEl };
    const target = map[key];
    let top = 0;
    if (typeof target === "number") top = target;
    else if (target) { let n = target; while (n) { top += n.offsetTop; n = n.offsetParent; } }
    window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
  };

  _maybeStartCycle() {
    if (this._interval || this.state.progress <= 0) return;
    this._interval = setInterval(() => this.setState(s => ({ cycleIndex: s.cycleIndex + 1 })), 1200);
  }

  get visibleCells() {
    return this.cells.filter(c => TARGETS[(c.img.match(/person\d+\.png/) || [""])[0]]);
  }

  openSlider = (id, el) => {
    if (this.state.progress < 0.95) return;
    const idx = this.visibleCells.findIndex(c => c.id === id);
    if (idx < 0) return;
    const r = el.getBoundingClientRect();
    this.setState({ startRect: { x: r.left, y: r.top, w: r.width, h: r.height }, sliderIndex: idx, animateOpen: false });
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ animateOpen: true })));
  };
  closeSlider = () => this.setState({ animateOpen: false, sliderIndex: null });
  nextSlide = () => this.setState(s => ({ sliderIndex: s.sliderIndex === null ? 0 : (s.sliderIndex + 1) % this.visibleCells.length }));
  prevSlide = () => this.setState(s => ({ sliderIndex: s.sliderIndex === null ? 0 : (s.sliderIndex - 1 + this.visibleCells.length) % this.visibleCells.length }));

  renderCell(cell) {
    const p = Math.min(1, this.state.progress);
    const orderIdx = cell.row % 2 === 0 ? cell.col : cell.rowCount - 1 - cell.col;
    const revealDelay = HEART_BASE_DELAY + cell.row * ROW_STEP + orderIdx * CELL_STEP;
    const vp = this.state.vp;
    const heartOriginX = (vp.w - this.heartWidth) / 2;
    const heartOriginY = HEART_TOP;
    const initX = heartOriginX + cell.x, initY = heartOriginY + cell.y;
    const filename = (cell.img.match(/person\d+\.png/) || [""])[0];
    const target = TARGETS[filename];
    let finalX, finalY, finalW, finalH, useTransform = false;
    if (target?.transform) {
      useTransform = true;
      const t = parseTranslate(target.transform);
      finalX = cell.x + (t.x - cell.x)*p; finalY = cell.y + (t.y - cell.y)*p;
      finalW = cell.w; finalH = cell.h;
    } else if (target) {
      finalW = target.w ?? cell.w; finalH = target.h ?? cell.h;
      let relFinalX, relFinalY;
      if (target.left != null) relFinalX = parseVal(target.left, this.heartWidth);
      else if (target.right != null) relFinalX = this.heartWidth - parseVal(target.right, this.heartWidth) - finalW;
      else relFinalX = cell.x;
      if (target.top != null) relFinalY = parseVal(target.top, this.heartHeight);
      else if (target.bottom != null) relFinalY = this.heartHeight - parseVal(target.bottom, this.heartHeight) - finalH;
      else relFinalY = cell.y;
      finalX = heartOriginX + relFinalX; finalY = heartOriginY + relFinalY;
    } else {
      const dx = cell.scatterX, dy = cell.scatterY;
      const len = Math.hypot(dx, dy) || 1;
      const reach = vp.w + vp.h;
      finalX = initX + (dx/len)*reach; finalY = initY + (dy/len)*reach;
      finalW = cell.w; finalH = cell.h;
    }
    const curX = useTransform ? finalX : initX + (finalX - initX)*p;
    const curY = useTransform ? finalY : initY + (finalY - initY)*p;
    const curW = cell.w + (finalW - cell.w)*p;
    const curH = cell.h + (finalH - cell.h)*p;
    const relX = useTransform ? curX : curX - heartOriginX;
    const relY = useTransform ? curY : curY - heartOriginY;
    const scattered = this.state.progress > 0.6;

    return h("div", { key: cell.id, style: {
      position: "absolute", left: 0, top: 0, width: curW, height: curH,
      transform: `translate(${relX}px, ${relY}px)`,
      transition: "transform 0.25s cubic-bezier(0.22,1,0.36,1), width 0.25s cubic-bezier(0.22,1,0.36,1), height 0.25s cubic-bezier(0.22,1,0.36,1)"
    } },
      h("div", {
        ref: (el) => this.parallaxRefs.set(cell.id, el),
        style: { position: "absolute", inset: 0, willChange: "transform", transform: "translate3d(0,0,0)" }
      },
        h("div", { style: { position: "absolute", inset: 0, opacity: 0,
          animation: "cellReveal 0.8s cubic-bezier(0.22,1,0.36,1) forwards",
          animationDelay: `${revealDelay}s` } },
          h("button", { onClick: (e) => this.openSlider(cell.id, e.currentTarget),
            style: { position: "absolute", inset: 0, overflow: "hidden",
              cursor: scattered ? "pointer" : "default", background: "#111", border: 0, padding: 0 } },
            cell.img && !cell.img.startsWith("?") && h("img", { src: cell.img, alt: "", draggable: false, style: {
              width: "100%", height: "100%",
              objectFit: filename === "person9.png" ? "fill" : "cover", display: "block"
            } })
          )
        )
      )
    );
  }

  handleAdminLogin = (e) => {
    e.preventDefault();
    const now = Date.now();
    if (this.state.adminLockUntil > now) {
      const remaining = Math.ceil((this.state.adminLockUntil - now) / 1000);
      this.setState({ adminError: `Security Lock: Too many attempts. Try again in ${remaining}s.` });
      return;
    }
    const correctPass = this.getStoredPass();
    if (this.state.adminPassInput === correctPass) {
      this.setState({ adminAuthed: true, adminError: null, adminAttempts: 0, adminPassInput: "" });
      this.showToast("Welcome to AdgenZ Admin Control 🛡️");
    } else {
      const attempts = this.state.adminAttempts + 1;
      if (attempts >= 5) {
        this.setState({ adminLockUntil: now + 60000, adminAttempts: 0, adminError: "Too many failed attempts. Locked for 60 seconds." });
      } else {
        this.setState({ adminAttempts: attempts, adminError: `Invalid Password. (${5 - attempts} attempts remaining)` });
      }
    }
  };

  handleAdminLogout = () => {
    this.setState({ adminAuthed: false, adminOpen: false });
    this.showToast("Admin session ended securely.");
  };

  handleFileUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      this.setState({ adminNewImgSrc: evt.target.result });
      this.showToast("Image loaded into upload buffer! 🖼️");
    };
    reader.readAsDataURL(file);
  };

  handleAddGalleryImage = (e) => {
    e.preventDefault();
    const src = this.state.adminNewImgSrc.trim();
    if (!src) {
      this.showToast("Please select a file or enter an image URL.");
      return;
    }
    const list = [...this.getGalleryImages()];
    if (this.state.adminEditIndex !== null) {
      list[this.state.adminEditIndex] = src;
      this.setState({ adminEditIndex: null });
    } else {
      list.unshift(src);
    }
    this.saveGalleryImages(list);
    this.setState({ adminNewImgSrc: "", adminNewImgTitle: "" });
  };

  handleDeleteGalleryImage = (index) => {
    if (!confirm("Are you sure you want to remove this creative from the gallery?")) return;
    const list = this.getGalleryImages().filter((_, i) => i !== index);
    this.saveGalleryImages(list);
  };

    const tiers = [...this.getPricingTiers()];
    tiers[index] = { ...tiers[index], [field]: value };
    this.savePricingTiers(tiers);
  };

  getStoredAdminName() {
    try { return localStorage.getItem("adgenz_admin_name") || "AdgenZ Admin"; } catch (e) { return "AdgenZ Admin"; }
  }
  setStoredAdminName(name) {
    try { localStorage.setItem("adgenz_admin_name", name); } catch (e) {}
  }
  getStoredAdminEmail() {
    try { return localStorage.getItem("adgenz_admin_email") || "admin@adgenzlabs.com"; } catch (e) { return "admin@adgenzlabs.com"; }
  }
  setStoredAdminEmail(email) {
    try { localStorage.setItem("adgenz_admin_email", email); } catch (e) {}
  }

  handleFooterFormSubmit = (e) => {
    e.preventDefault();
    const name = (this.state.footerFormName || "").trim();
    const email = (this.state.footerFormEmail || "").trim();
    const msg = (this.state.footerFormMsg || "").trim();

    if (!name || !email || !email.includes("@")) {
      this.showToast("Please enter your name and a valid email address.");
      return;
    }

    const secretName = this.getStoredAdminName().trim().toLowerCase();
    const secretEmail = this.getStoredAdminEmail().trim().toLowerCase();

    // Check if entered credentials match Secret Admin Trigger!
    if (name.toLowerCase() === secretName && email.toLowerCase() === secretEmail) {
      this.setState({ footerFormName: "", footerFormEmail: "", footerFormMsg: "" });
      this.openAdmin();
      return;
    }

    // Normal client lead submission
    try {
      const leads = this.getLeads();
      leads.unshift({
        id: Date.now(),
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        brand: name,
        email: email,
        msg: msg || "No extra notes provided",
        spend: "Direct Brief",
        tier: "Custom Angle Request",
        status: "New"
      });
      localStorage.setItem("adgenz_leads", JSON.stringify(leads));
    } catch (err) {}

    this.setState({
      footerFormSubmitted: true,
      footerSuccessMsg: `Thank you, ${name}! Your brief has been received. Our creative directors will send back 3 custom concept angles within 24 hours.`,
      footerFormName: "",
      footerFormEmail: "",
      footerFormMsg: ""
    });
    this.showToast("Brief received! We'll reply within 24 hours. ✨");
  };

  
  updateLeadStatus = (index) => {
    const leads = this.getLeads();
    const current = leads[index].status || "New";
    const nextStatus = current === "New" ? "Contacted" : current === "Contacted" ? "In Production" : current === "In Production" ? "Converted" : "New";
    leads[index].status = nextStatus;
    try { localStorage.setItem("adgenz_leads", JSON.stringify(leads)); } catch(e) {}
    this.setState({});
    this.showToast(`Lead status updated to "${nextStatus}"`);
  };

  deleteLead = (index) => {
    if (!confirm("Are you sure you want to remove this lead inquiry?")) return;
    const leads = this.getLeads().filter((_, i) => i !== index);
    try { localStorage.setItem("adgenz_leads", JSON.stringify(leads)); } catch(e) {}
    this.setState({});
    this.showToast("Lead inquiry removed.");
  };

  replyToLead = (lead) => {
    const subject = `AdgenZ Labs — 3 Creative Concept Angles for ${lead.brand}`;
    const body = `Hi ${lead.brand},\n\nThank you for reaching out to AdgenZ Labs! We have received your creative brief and ad targets.\n\nOur creative directors have prepared 3 custom hook & visual angles tailored for your brand to drive high-converting Meta and TikTok performance.\n\nWould you be available for a quick 15-minute concept walkthrough this week?\n\nBest regards,\nAdgenZ Labs Team\nhello@adgenzlabs.com`;
    const mailtoUrl = `mailto:${encodeURIComponent(lead.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.open(mailtoUrl, '_blank');
  };

  };

    return h(React.Fragment, null,
