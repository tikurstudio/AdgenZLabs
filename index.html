      <style>
        html,
        body {
          background-color: #0E0E0E;
          color: #FCFCFC;
          margin: 0;
        }

        html {
          scroll-behavior: auto;
        }

        body {
          overflow-x: hidden;
        }

        .asset-card-wrap {
          position: relative;
          background: #141416;
          overflow: hidden;
        }

        .asset-card-wrap::before {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.05) 50%, transparent 100%);
          background-size: 200% 100%;
          animation: cardShimmer 1.8s ease-in-out infinite;
          pointer-events: none;
          z-index: 1;
          transition: opacity 0.4s ease;
        }

        .asset-card-wrap.loaded::before {
          opacity: 0;
          animation: none;
        }

        @keyframes cardShimmer {
          0% {
            background-position: 200% 0;
          }

          100% {
            background-position: -200% 0;
          }
        }

        .smooth-img {
          opacity: 0;
          transition: opacity 0.35s ease;
        }

        .smooth-img.is-loaded {
          opacity: 1;
        }

        .gallery-card {
          will-change: transform;
          transform: scale(0);
          transition: transform 0.15s linear, border-color 0.3s ease, box-shadow 0.3s ease;
          background: #141416;
          position: relative;
          cursor: pointer !important;
        }

        .gallery-card:hover {
          border-color: rgba(242, 211, 56, 0.5);
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(242, 211, 56, 0.15);
        }

        .gallery-card img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
          opacity: 0;
          transition: opacity 0.35s ease;
        }

        .gallery-card img.is-loaded {
          opacity: 1;
        }

        @keyframes logoDraw {
          to {
            stroke-dashoffset: 0;
          }
        }

        @keyframes lineGrow {
          from {
            transform: scaleX(0);
          }

          to {
            transform: scaleX(1);
          }
        }

        @keyframes letterIn {
          from {
            opacity: 0;
            filter: blur(6px);
            transform: translateX(8px);
          }

          to {
            opacity: 1;
            filter: blur(0);
            transform: translateX(0);
          }
        }

        @keyframes wordIn {
          from {
            opacity: 0;
            color: rgba(255, 255, 255, 0.15);
            transform: translateY(18px);
          }

          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes wordInDim {
          from {
            opacity: 0;
            filter: brightness(0.3);
            transform: translateY(18px);
          }

          to {
            opacity: 1;
            filter: brightness(1);
            transform: translateY(0);
          }
        }

        @keyframes paraWordIn {
          from {
            opacity: 0;
            filter: blur(5px);
            transform: translateY(10px);
          }

          to {
            opacity: 1;
            filter: blur(0);
            transform: translateY(0);
          }
        }

        @keyframes arrowIn {
          from {
            opacity: 0;
            transform: translateX(-4px);
          }

          to {
            opacity: 1;
            transform: translateX(0);
          }
        }

        @keyframes btnPop {
          from {
            transform: scale(0);
          }

          to {
            transform: scale(1);
          }
        }

        @keyframes btnExpand {
          from {
            width: 41px;
          }

          to {
            width: var(--btn-final-width, 150px);
          }
        }

        @keyframes cellReveal {
          from {
            opacity: 0;
            filter: blur(8px);
            transform: translateY(30px);
          }

          to {
            opacity: 1;
            filter: blur(0);
            transform: translateY(0);
          }
        }

        @keyframes smallCubeIn {
          from {
            opacity: 0;
            transform: scale(0);
          }

          to {
            opacity: 1;
            transform: scale(1);
          }
        }

        @keyframes smallImgIn {
          from {
            opacity: 0;
            transform: scale(0.3);
          }

          to {
            opacity: 1;
            transform: scale(1);
          }

        @keyframes imgFadeIn {
          from {
            opacity: 0;
            transform: scale(0.75);
          }

          to {
            opacity: 1;
            transform: scale(1);
          }
        }

        @keyframes modalFade {
          from {
            opacity: 0;
          }

          to {
            opacity: 1;
          }
        }

        @keyframes pillPop {
          from {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.6);
          }

          to {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
          }
        }

        @keyframes tagIn {
          from {
            opacity: 0;
            filter: blur(6px);
            transform: translateY(10px);

            filter: blur(0);

        /* Interactive Elements & Toast */
        .toast-notification {
          position: fixed;
          bottom: 30px;
          right: 30px;
          background: #111114;
          color: #FFF;
          border: 1px solid rgba(255, 255, 255, 0.15);
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);

          border-radius: 999px;
          font-family: 'Inter Tight', sans-serif;
          font-size: 14px;

          z-index: 99999;
          display: flex;
          align-items: center;
          gap: 10px;
          animation: toastIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes toastIn {
          from {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
          }

          to {
            opacity: 1;
            transform: translateY(0) scale(1);
          }
        }

        .interactive-modal-overlay {

const H_GAP = 10, V_GAP = 10;

function buildCells() {
  const rowWidths = ROWS.map(row => {
    const w = row.width ?? row.size;
    let total = row.count * w;
    for (let i = 0; i < row.count - 1; i++) total += row.gaps?.[i] ?? H_GAP;
    return total;
  });
  const heartWidth = Math.max(...rowWidths);
  let y = 0, id = 0;
  const cells = [];
  for (let r = 0; r < ROWS.length; r++) {
    const row = ROWS[r];
    const w = row.width ?? row.size, ch = row.size;
    const rowW = rowWidths[r];
    let x = (heartWidth - rowW) / 2;
    for (let c = 0; c < row.count; c++) {
      const seed = (r * 131 + c * 17 + 7) * 9301;
      const rand = (n) => { const v = Math.sin(seed + n) * 43758.5453; return v - Math.floor(v); };
      const angle = rand(1) * Math.PI * 2;
      const dist = 420 + rand(2) * 400;
      const pItem = PERSON_ITEMS[id % PERSON_ITEMS.length];
      cells.push({
        id, row: r, col: c, rowCount: row.count, x, y, w, h: ch,
        scatterX: Math.cos(angle) * dist, scatterY: Math.sin(angle) * dist * 0.7,
        img: pItem.img,
        tag: pItem.tag,
      });
      id++;
      x += w + (row.gaps?.[c] ?? H_GAP);
    }
    y += ch + V_GAP;
  }
  return { cells, heartWidth, heartHeight: y - V_GAP };
}

function CrossfadeImg({ src, alt, style }) {
  const [current, setCurrent] = React.useState(src);
  const [previous, setPrevious] = React.useState(null);
  const [showCurrent, setShowCurrent] = React.useState(true);
  React.useEffect(() => {
    if (src === current) return;
    setPrevious(current); setCurrent(src); setShowCurrent(false);
    const t = setTimeout(() => setShowCurrent(true), 30);
    return () => clearTimeout(t);
  }, [src, current]);
  React.useEffect(() => {
    if (!showCurrent || !previous) return;
    const t = setTimeout(() => setPrevious(null), 650);
    return () => clearTimeout(t);
  }, [showCurrent, previous]);
  return h(React.Fragment, null,
    previous && h("img", { src: previous, alt, draggable: false, style: { ...style, opacity: showCurrent?0:1, transition: "opacity 0.6s ease", zIndex: 1 } }),

}

    const built = buildCells();

    if (this.cells[40]) this.cells[40].img = "opt/green-ad.jpg";

    this.state = {
      progress: 0, cycleIndex: 0, sliderIndex: null, startRect: null, animateOpen: false,
      vp: { w: typeof window !== "undefined" ? window.innerWidth : 1338, h: typeof window !== "undefined" ? window.innerHeight : 829 },
      menuOpen: false, linesLoaded: false,
      loadProgress: 0, appVisible: false, splashFading: false, splashGone: false,
      heroSrc: null,
      palletProgress: 0, palletHeroSeen: false, sec2Seen: false, sec3Seen: false,
      palletInView: false, palletSlide: 0, palletHover: null, galleryDetailIndex: null,
      galleryGroups: null, activeGroupIdx: null, activeItemIdx: null, adminActiveGroupIdx: 0,
      adminNewGroupTitle: "", adminNewGroupCat: "", campaignFilter: "all",
      billingQuarterly: false, legalModalTab: null,

    };
    this.parallaxRefs = new Map();

  componentDidMount() {
    document.title = "Sifen Tekalign — The Creative I Build To Out Gen the Noise";
    let link = document.querySelector("link[rel~='icon']");
    if (!link) { link = document.createElement("link"); link.rel = "icon"; document.head.appendChild(link); }
    link.type = "image/svg+xml";
    link.href = "./favicon.svg";
    this._onResize = () => { this.setState({ vp: { w: window.innerWidth, h: window.innerHeight } }); if (this._palletInit) this._measurePallet(); };
    window.addEventListener("resize", this._onResize);

    window.__sifenScroll = (key) => this.scrollToSection(key);
    window.__adgenzScroll = window.__sifenScroll;

    // Fetch live gallery groups from Vercel backend
    fetch("/api/gallery")
      .then(res => res.json())
      .then(data => {
        if (data && data.success && Array.isArray(data.groups) && data.groups.length > 0) {
          this.setState({ galleryGroups: data.groups });
        }
      })
      .catch(() => {});
    
    // Anti-download protection
    this._preventDownload = (e) => {
      if (e.target.tagName === 'IMG' || e.target.tagName === 'VIDEO' || e.target.closest('.gallery-card') || e.target.closest('.modal-img-wrap')) {
        e.preventDefault();
      }
    };
    window.addEventListener('contextmenu', this._preventDownload);
    window.addEventListener('dragstart', this._preventDownload);

    // =========================================================================
    // PHASE 1: HERO PRIORITY LOADING (Hero Video & All Unique Hero Images)
    // =========================================================================
    const HERO_VID_URL = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260417_061226_74f0749c-a22d-42b3-895e-5d6203bc741c.mp4";
    const isHeroWarm = typeof sessionStorage !== "undefined" && (sessionStorage.getItem("sifen_hero_warm") === "1" || sessionStorage.getItem("adgenz_hero_warm") === "1");

    const heroImageSet = new Set(this.cells.map(c => c.img).filter(Boolean));
    Object.values(SMALL_IMAGES).forEach(src => src && heroImageSet.add(src));
    Object.values(SMALL_IMAGES_EXPAND).forEach(src => src && heroImageSet.add(src));
    const tier1Images = Array.from(heroImageSet);

    const totalTier1 = tier1Images.length + 1;
    let loadedTier1 = 0;
    let finishedTier1 = false;
    const startT = Date.now();
    const MIN_SPLASH = isHeroWarm ? 280 : 650;
    const MAX_SPLASH = 2800;

    const finishTier1 = () => {
      if (finishedTier1) return;
      finishedTier1 = true;
      clearTimeout(this._splashMaxT);
      try { if (typeof sessionStorage !== "undefined") sessionStorage.setItem("sifen_hero_warm", "1"); } catch(e) {}

      const wait = Math.max(0, MIN_SPLASH - (Date.now() - startT));
      this._splashT1 = setTimeout(() => {
        this.setState({ loadProgress: 1, appVisible: true, splashFading: true });
        this._linesT = setTimeout(() => this.setState({ linesLoaded: true }), 700);
        this._splashT2 = setTimeout(() => this.setState({ splashGone: true }), 450);

        // Phase 2: Start background loading Section 2 immediately as hero reveals
        this._startPhase2Loading();
      }, wait);
    };

    const onTier1ItemDone = () => {
      loadedTier1++;
      this.setState({ loadProgress: Math.min(1, loadedTier1 / totalTier1) });
      if (loadedTier1 >= totalTier1) finishTier1();
    };

    // Preload Hero Image & Video buffer
    const heroBgImg = new Image();
    heroBgImg.src = "./opt/hero-bg.jpg";
    heroBgImg.onload = onTier1ItemDone;
    heroBgImg.onerror = onTier1ItemDone;

    const vidPreload = document.createElement("video");
    vidPreload.src = HERO_VID_URL;
    vidPreload.preload = "auto";
    vidPreload.muted = true;
    vidPreload.playsInline = true;
    vidPreload.addEventListener("loadeddata", onTier1ItemDone, { once: true });
    vidPreload.addEventListener("canplay", onTier1ItemDone, { once: true });
    vidPreload.addEventListener("error", onTier1ItemDone, { once: true });
    vidPreload.load();

    // Preload all Tier 1 Hero Images and store in persistent cache
    this._preloadImgs = tier1Images.map(src => {
      const im = new Image();
      im.onload = () => {
        onTier1ItemDone();
        if (typeof window !== "undefined" && "caches" in window) {
          caches.open("sifen-media-cache-v2").then(c => c.add(encodeURI(src)).catch(() => {})).catch(() => {});
        }
      };
      im.onerror = onTier1ItemDone;
      im.src = src;
      return im;
    });

    this._splashMaxT = setTimeout(finishTier1, MAX_SPLASH);

    // scroll-driven heart dispersal (sticky hero scrubbed by scroll position)
    const MAX = 600;
    this._onScrollFx = () => {
      if (this._palletEl && this._palletInit) {
        const p = Math.min(1, Math.max(0, (window.scrollY - this._palletTop) / this._palletScrollable));
        if (Math.abs(p - (this._palletProgRef || 0)) > 0.0015) { this._palletProgRef = p; this.setState({ palletProgress: p }); }
      }
      if (this.state.sliderIndex !== null) return;
      const p = Math.max(0, Math.min(1, window.scrollY / MAX));
      if (p === this.progressRef.current) return;
      this.progressRef.current = p;
      this.setState({ progress: p });
      if (p > 0) this._maybeStartCycle();
    };
    window.addEventListener("scroll", this._onScrollFx, { passive: true });
    this._onScrollFx();

    // keys
    this._onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "A" || e.key === "a")) {
        e.preventDefault();
        this.openAdmin();
        return;
      }
      if (e.key === "Escape") { this.closeSlider(); this.closeGalleryDetail(); this.closeAdmin(); }
      if (this.state.sliderIndex === null) return;
      if (e.key === "ArrowRight") { if (this.state.activeGroupIdx !== null || this.state.galleryDetailIndex !== null) this.nextGalleryDetail(); else this.nextSlide(); }
      if (e.key === "ArrowLeft") { if (this.state.activeGroupIdx !== null || this.state.galleryDetailIndex !== null) this.prevGalleryDetail(); else this.prevSlide(); }
    };
    window.addEventListener("keydown", this._onKey);

    // parallax rAF
    const target = { x: 0, y: 0 }, current = { x: 0, y: 0 };
    const heroTarget = { x: 0, y: 0 }, heroCur = { x: 0, y: 0 };
    const mouseRaw = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const mouseSmooth = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

    this._onMove = (e) => {
      target.x = (e.clientX/window.innerWidth)*2-1;
      target.y = (e.clientY/window.innerHeight)*2-1;
      heroTarget.x = (e.clientX/window.innerWidth - 0.5) * 2;
      heroTarget.y = (e.clientY/window.innerHeight - 0.5) * 2;
      mouseRaw.x = e.clientX;
      mouseRaw.y = e.clientY;
    };
    this._onLeave = () => {
      target.x = 0; target.y = 0;
      heroTarget.x = 0; heroTarget.y = 0;
    };
    window.addEventListener("mousemove", this._onMove);
    document.addEventListener("mouseleave", this._onLeave);
    window.addEventListener("blur", this._onLeave);

    const cfg = this._parallaxConfig();
    const tick = () => {
      const on = this.progressRef.current >= 1;
      const tx = on ? target.x : 0, ty = on ? target.y : 0;
      current.x += (tx - current.x)*0.08; current.y += (ty - current.y)*0.08;
      this.parallaxRefs.forEach((el, id) => {
        if (!el) return;
        const c = cfg.get(id); if (!c) return;
        el.style.transform = `translate3d(${(-current.x*c.mx).toFixed(2)}px, ${(-current.y*c.my).toFixed(2)}px, 0)`;
      });

      // Smooth hero background cursor tracking & scrolling effect
      heroCur.x += (heroTarget.x - heroCur.x) * 0.06;
      heroCur.y += (heroTarget.y - heroCur.y) * 0.06;
      mouseSmooth.x += (mouseRaw.x - mouseSmooth.x) * 0.1;
      mouseSmooth.y += (mouseRaw.y - mouseSmooth.y) * 0.1;

      if (this._heroBg) {
        const hp = this.progressRef.current || 0;
        const hShiftX = heroCur.x * -24;
        const hShiftY = heroCur.y * -18 + (hp * -110);
        const hScale = (1.06 + hp * 0.14).toFixed(4);
        const hBlur = (hp * 5).toFixed(1);
        const hBrightness = Math.max(0.65, (1 - hp * 0.35)).toFixed(3);
        this._heroBg.style.transform = `translate3d(${hShiftX.toFixed(2)}px, ${hShiftY.toFixed(2)}px, 0) scale(${hScale})`;
        this._heroBg.style.filter = `blur(${hBlur}px) brightness(${hBrightness})`;
      }

      if (this._heroSpotlight) {
        const hp = this.progressRef.current || 0;
        if (hp < 0.95) {
          this._heroSpotlight.style.opacity = (1 - hp * 1.2).toFixed(2);
          this._heroSpotlight.style.background = `radial-gradient(circle 540px at ${mouseSmooth.x.toFixed(1)}px ${mouseSmooth.y.toFixed(1)}px, rgba(242, 211, 56, 0.12) 0%, rgba(255, 255, 255, 0.04) 35%, transparent 70%)`;
        } else {
          this._heroSpotlight.style.opacity = "0";
        }
      }
      // Gallery cards scale in/out based on viewport position
      const vh = window.innerHeight;
      this._galleryCards.forEach((el) => {
        if (!el) return;
        // Measure unscaled layout box (scale(0) collapses getBoundingClientRect)
        const height = el.offsetHeight || el.offsetWidth || 300;
        let pageTop = 0, node = el;
        while (node) { pageTop += node.offsetTop; node = node.offsetParent; }
        const top = pageTop - window.scrollY;
        const bottom = top + height;
        if (bottom <= 0 || top >= vh) { el.style.transform = "scale(0)"; return; }
        const enter = Math.min(1, (vh - top) / (vh * 0.6));
        const exit = Math.min(1, bottom / (vh * 0.4));
        el.style.transform = `scale(${Math.max(0, Math.min(enter, exit)).toFixed(3)})`;
      });
      // Gallery bg video: zoom in as you scroll through the section
      if (this._galleryVideo && this._gallerySection) {
        const rect = this._gallerySection.getBoundingClientRect();
        const total = rect.height + vh;
        const p = Math.max(0, Math.min(1, (vh - rect.top) / total));
        this._galleryVideo.style.transform = `scale(${(1 + p * 0.45).toFixed(4)})`;
      }
      this._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);

    // Pallet section mounts only after the splash reveals the app; poll for it.
    this._palletPoll = setInterval(() => {
      if (this._palletEl && !this._palletInit) { this._initPallet(); clearInterval(this._palletPoll); this._palletPoll = null; }
    }, 120);
  }

  componentWillUnmount() {
    window.removeEventListener("resize", this._onResize);
    window.removeEventListener("scroll", this._onScrollFx);
    window.removeEventListener("keydown", this._onKey);
    window.removeEventListener("mousemove", this._onMove);
    document.removeEventListener("mouseleave", this._onLeave);
    window.removeEventListener("blur", this._onLeave);
    cancelAnimationFrame(this._raf);
    this._galleryCards.clear();
    if (this._interval) clearInterval(this._interval);
    clearTimeout(this._linesT);
    clearTimeout(this._splashT1); clearTimeout(this._splashT2); clearTimeout(this._splashMaxT);
    if (this._preloadImgs) this._preloadImgs.forEach(im => { im.onload = im.onerror = null; });
    if (this._heroBlobUrl) URL.revokeObjectURL(this._heroBlobUrl);
    if (this._palletIO) this._palletIO.disconnect();
    if (this._palletContainerIO) this._palletContainerIO.disconnect();
    if (this._palletRO) this._palletRO.disconnect();
    if (this._bannerInterval) clearInterval(this._bannerInterval);
    if (this._palletPoll) clearInterval(this._palletPoll);
    if (this._phase2Timer) clearTimeout(this._phase2Timer);
    if (this._phase3Timer) clearTimeout(this._phase3Timer);
  }

  _startPhase2Loading = () => {
    // Phase 2: Preload Section 2 (The Pallet cards & banners)
    const palletAssets = [...new Set([...PALLET_CARDS, ...PALLET_BANNERS])];
    const idleRunner = typeof requestIdleCallback !== "undefined" ? requestIdleCallback : (cb) => setTimeout(cb, 100);

    idleRunner(() => {
      palletAssets.forEach(src => {
        const im = new Image();
        im.src = src;
        if (typeof window !== "undefined" && "caches" in window) {
          caches.open("sifen-media-cache-v2").then(c => c.add(encodeURI(src)).catch(() => {})).catch(() => {});
        }
      });
      this._phase3Timer = setTimeout(this._startPhase3Loading, 600);
    });
  };

  _startPhase3Loading = () => {
    // Phase 3: Gallery portfolio images (in manageable batches)
    const galleryAssets = this.getGalleryImages();
    const idleRunner = typeof requestIdleCallback !== "undefined" ? requestIdleCallback : (cb) => setTimeout(cb, 200);

    idleRunner(() => {
      let idx = 0;
      const loadNextBatch = () => {
        const batch = galleryAssets.slice(idx, idx + 6);
        if (!batch.length) return;
        batch.forEach(src => {
          const im = new Image();
          im.src = src;
          if (typeof window !== "undefined" && "caches" in window) {
            caches.open("sifen-media-cache-v2").then(c => c.add(encodeURI(src)).catch(() => {})).catch(() => {});
          }
        });
        idx += 6;
        if (idx < galleryAssets.length) setTimeout(loadNextBatch, 300);
      };
      loadNextBatch();
    });
  };

  _initPallet() {
    if (this._palletInit || !this._palletEl) return;
    {
      this._palletInit = true;
      this._measurePallet();
      this._palletMeasureT = setTimeout(this._measurePallet, 300);
      if (typeof ResizeObserver !== "undefined") {
        this._palletRO = new ResizeObserver(this._measurePallet);
        this._palletRO.observe(this._palletEl);
      }
      this._palletIO = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (!e.isIntersecting) return;
          if (e.target === this._palletSec1El) this.setState({ palletHeroSeen: true });
          if (e.target === this._palletSec2El) this.setState({ sec2Seen: true });
          if (e.target === this._palletSec3El) { this.setState({ sec3Seen: true }); this._startBanner(); }
        });
      }, { threshold: 0.2 });
      [this._palletSec1El, this._palletSec2El, this._palletSec3El].forEach((el) => el && this._palletIO.observe(el));
      this._palletContainerIO = new IntersectionObserver((es) => {
        this.setState({ palletInView: es[0].isIntersecting });
      }, { rootMargin: "10% 0px 10% 0px" });
      this._palletContainerIO.observe(this._palletEl);
      this._onScrollFx();
    }
  }

  _measurePallet = () => {
    const el = this._palletEl;
    if (!el) return;
    let top = 0, n = el;
    while (n) { top += n.offsetTop; n = n.offsetParent; }
    const vh = window.innerHeight;
    const scrollable = Math.max(1, el.offsetHeight - vh);
    let s2 = 0, m = this._palletSec2El;
    while (m) { s2 += m.offsetTop; m = m.offsetParent; }
    this._palletTop = top;
    this._palletScrollable = scrollable;
    this._palletLp = Math.min(0.99, Math.max(0.05, (s2 - top) / scrollable));
  };

  _startBanner = () => {
    if (this._bannerInterval) return;
    this._bannerInterval = setInterval(() => this.setState((s) => ({ palletSlide: (s.palletSlide + 1) % PALLET_BANNERS.length })), 3000);
  };

  renderPalletCards() {
    const vp = this.state.vp;
    const lp = this._palletLp || 0.5;
    const scrollable = this._palletScrollable || vp.h * 2;
    const cp = Math.min(this.state.palletProgress, lp);
    const isLocked = this.state.palletProgress >= lp;
    const HERO_ROW_Y = 522;
    const stackCx = vp.w / 2, stackCy = vp.h / 2;
    const cascadeLeftRef = vp.w * 0.4;
    const p1 = lp * 0.33, p2 = lp * 0.66;
    const wrapperStyle = isLocked
      ? { position: "absolute", top: lp * scrollable, left: 0, width: "100%", height: vp.h, zIndex: 5, pointerEvents: "none" }
      : { position: "fixed", inset: 0, zIndex: 5, pointerEvents: "none" };
    return h("div", { style: wrapperStyle },
      FAN_SLOTS.map((slot, i) => {
        const cas = CASCADE[i];
        const s1Cx = vp.w / 2 + slot.x, s1Cy = HERO_ROW_Y + slot.y;
        const s2Cx = cascadeLeftRef + cas.left + 110, s2Cy = cas.top + 110;
        const cx = interp(cp, [0, p1, p2, lp], [s1Cx, stackCx, stackCx, s2Cx]);
        const cy = interp(cp, [0, p1, p2, lp], [s1Cy, stackCy, s2Cy, s2Cy]);
        const rot = interp(cp, [0, p1, lp], [slot.rotate, 0, cas.rotate]);
        const sc = interp(cp, [0, p1, lp], [slot.scale, 1, 1]);
        const hovered = this.state.palletHover === i;
        return h("div", { key: "pc" + i,
          onMouseEnter: () => this.setState({ palletHover: i }),
          onMouseLeave: () => this.setState({ palletHover: null }),
          className: "asset-card-wrap",
          style: { position: "absolute", top: 0, left: 0, width: 220, height: 220, borderRadius: 18, overflow: "hidden",
            boxShadow: "0 20px 60px rgba(0,0,0,0.20)", background: "#141416",
            transform: `translate(${cx}px, ${cy}px) translate(-50%, -50%) rotate(${rot}deg) scale(${sc})`,
            transformOrigin: "center", zIndex: hovered ? 30 : cas.z, opacity: 0,
            animation: "palletCardIn 0.6s ease-out forwards", animationDelay: `${0.3 + i * 0.08}s`,
            pointerEvents: "auto", cursor: "pointer" } },
          h("img", { src: PALLET_CARDS[i], alt: "", draggable: false, decoding: "async", className: "smooth-img is-loaded", style: { width: "100%", height: "100%", objectFit: "cover", display: "block" } })
        );
      })
    );
  }

  renderPallet() {
    const IT = "'Inter Tight', sans-serif";
    const s = this.state;
    const primaryBtn = (label) => h("button", { key: "p",
      onMouseEnter: (e) => e.currentTarget.style.background = "#333333",
      onMouseLeave: (e) => e.currentTarget.style.background = "#111111",
      style: { background: "#111111", color: "#fff", fontFamily: IT, fontSize: 15, fontWeight: 600,
        padding: "14px 28px", borderRadius: 9999, border: "none", cursor: "pointer", transition: "background 0.2s" } }, label);
    const readMore = (outline) => h("button", { key: "r",
      onMouseEnter: (e) => e.currentTarget.style.background = "rgba(0,0,0,0.05)",
      onMouseLeave: (e) => e.currentTarget.style.background = "transparent",
      style: { background: "transparent", color: "#111111", fontFamily: IT, fontSize: 15, fontWeight: 500,
        padding: "14px 20px", borderRadius: 9999, border: outline ? "1.5px solid rgba(0,0,0,0.15)" : "none",
        cursor: "pointer", transition: "background 0.2s" } }, "Read more");
    const eyebrow = (text, seen) => h("div", { style: { fontFamily: IT, fontSize: 11, fontWeight: 500,
      letterSpacing: "2.5px", color: "rgba(0,0,0,0.45)", marginBottom: 20, opacity: 0,
      animation: seen ? "blurWordIn 0.6s ease-out forwards" : "none" } }, text);
    const bubble = (label, bg, seen, delay, extra, tail) => h("div", { style: {
      position: "absolute", zIndex: 20, background: bg, borderRadius: 9999, padding: "8px 18px",
      fontFamily: IT, fontSize: 15, fontWeight: 600, color: "#fff", opacity: 0, transformOrigin: "center",
      animation: seen ? `jellyIn 0.8s ease-out forwards` : "none", animationDelay: `${delay}s`, ...extra } },
      label, tail);
    const chevron = (dir) => h("svg", { width: 20, height: 20, viewBox: "0 0 24 24", fill: "none",
      stroke: "#111111", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
      h("polyline", { points: dir === "left" ? "15 18 9 12 15 6" : "9 18 15 12 9 6" }));

    return h("div", { ref: (el) => this._palletEl = el, style: {
      position: "relative", background: "#F2F2F0", color: "#111111", fontFamily: IT, zIndex: 2, overflow: "hidden"
    } },
      // decorative blobs
      h("div", { style: { position: "absolute", inset: 0, zIndex: 0, pointerEvents: "none" } },
        h("div", { style: { position: "absolute", top: "5%", left: "8%", width: 300, height: 300,
          background: "radial-gradient(circle, rgba(180,180,180,0.12) 0%, transparent 70%)", filter: "blur(40px)" } }),
        h("div", { style: { position: "absolute", top: "8%", right: "10%", width: 250, height: 250,
          background: "radial-gradient(circle, rgba(180,180,180,0.12) 0%, transparent 70%)", filter: "blur(40px)" } }),
        h("div", { style: { position: "absolute", top: "30%", left: "50%", transform: "translateX(-50%)", width: 600, height: 400,
          background: "radial-gradient(circle, rgba(160,160,160,0.08) 0%, transparent 70%)", filter: "blur(60px)" } })
      ),

      // card overlay
      s.palletHeroSeen && s.palletInView && this.renderPalletCards(),

      // SECTION 1 — hero
      h("section", { ref: (el) => this._palletSec1El = el, style: {
        position: "relative", minHeight: "100vh", overflow: "hidden", boxSizing: "border-box" } },
        h("main", { style: { paddingTop: 140, textAlign: "center", position: "relative", zIndex: 20 } },

  _parallaxConfig() {
    const areas = this.cells.map(c => c.w * c.h);
    const minA = Math.min(...areas), maxA = Math.max(...areas);
    const map = new Map();
    this.cells.forEach(c => {
      const a = c.w * c.h;
      const t = (a - minA) / (maxA - minA || 1);
      const base = 35 - t * 30;
      const hh = Math.sin(c.id * 12.9898) * 43758.5453;
      const r1 = hh - Math.floor(hh);
      const r2raw = Math.sin(c.id * 78.233) * 43758.5453;
      const r2 = r2raw - Math.floor(r2raw);
      map.set(c.id, { mx: base * (0.75 + r1*0.5), my: base * (0.75 + r2*0.5) });
    });
    return map;
  }

  scrollToSection = (key) => {
    this.setState({ menuOpen: false });
    const map = { home: 0, work: this._gallerySection, thelab: this._palletEl, about: this._palletEl, pricing: this._footerEl, contact: this._footerEl };
    const target = map[key];
    let top = 0;
    if (typeof target === "number") top = target;
    else if (target) { let n = target; while (n) { top += n.offsetTop; n = n.offsetParent; } }
    window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
  };

  renderCell(cell) {
    const p = Math.min(1, this.state.progress);
    const orderIdx = cell.row % 2 === 0 ? cell.col : cell.rowCount - 1 - cell.col;
    const revealDelay = HEART_BASE_DELAY + cell.row * ROW_STEP + orderIdx * CELL_STEP;
    const vp = this.state.vp;
    const heartOriginX = (vp.w - this.heartWidth) / 2;
    const heartOriginY = HEART_TOP;
    const initX = heartOriginX + cell.x, initY = heartOriginY + cell.y;
    const filename = cell.tag || (cell.img.match(/person\d+\.png/) || [""])[0];
    const target = TARGETS[filename];
    let finalX, finalY, finalW, finalH, useTransform = false;
    if (target?.transform) {
      useTransform = true;
      const t = parseTranslate(target.transform);
      finalX = cell.x + (t.x - cell.x)*p; finalY = cell.y + (t.y - cell.y)*p;
      finalW = cell.w; finalH = cell.h;
    } else if (target) {
      finalW = target.w ?? cell.w; finalH = target.h ?? cell.h;
      let relFinalX, relFinalY;
      if (target.left != null) relFinalX = parseVal(target.left, this.heartWidth);
      else if (target.right != null) relFinalX = this.heartWidth - parseVal(target.right, this.heartWidth) - finalW;
      else relFinalX = cell.x;
      if (target.top != null) relFinalY = parseVal(target.top, this.heartHeight);
      else if (target.bottom != null) relFinalY = this.heartHeight - parseVal(target.bottom, this.heartHeight) - finalH;
      else relFinalY = cell.y;
      finalX = heartOriginX + relFinalX; finalY = heartOriginY + relFinalY;
    } else {
      const dx = cell.scatterX, dy = cell.scatterY;
      const len = Math.hypot(dx, dy) || 1;
      const reach = vp.w + vp.h;
      finalX = initX + (dx/len)*reach; finalY = initY + (dy/len)*reach;
      finalW = cell.w; finalH = cell.h;
    }
    const curX = useTransform ? finalX : initX + (finalX - initX)*p;
    const curY = useTransform ? finalY : initY + (finalY - initY)*p;
    const curW = cell.w + (finalW - cell.w)*p;
    const curH = cell.h + (finalH - cell.h)*p;
    const relX = useTransform ? curX : curX - heartOriginX;
    const relY = useTransform ? curY : curY - heartOriginY;
    const scattered = this.state.progress > 0.6;

    return h("div", { key: cell.id, style: {
      position: "absolute", left: 0, top: 0, width: curW, height: curH,
      transform: `translate(${relX}px, ${relY}px)`,
      transition: "transform 0.25s cubic-bezier(0.22,1,0.36,1), width 0.25s cubic-bezier(0.22,1,0.36,1), height 0.25s cubic-bezier(0.22,1,0.36,1)"
    } },

        ref: (el) => this.parallaxRefs.set(cell.id, el),

      },
        h("div", { style: { position: "absolute", inset: 0, opacity: 0,

          animationDelay: `${revealDelay}s` } },
          h("button", { onClick: (e) => this.openSlider(cell.id, e.currentTarget),
            className: "asset-card-wrap",

              cursor: scattered ? "pointer" : "default", background: "#141416", border: 0, padding: 0 } },
            cell.img && !cell.img.startsWith("?") && h("img", {

    );
  }

    if (e) e.preventDefault();
    const entered = (this.state.adminPassInput || "").trim();
    if (!entered) {
      this.setState({ adminError: "Please enter your master password." });
      return;
    }
    this.setState({ adminLoading: true, adminError: null });

    try {
      const res = await fetch("/api/admin-auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: entered })
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok && data.success && data.token) {
        if (typeof sessionStorage !== "undefined") {
          sessionStorage.setItem("sifen_admin_token", data.token);
        }
        this.setState({
          adminAuthed: true,
          adminToken: data.token,
          adminLoading: false,
          adminError: null,
          adminPassInput: "",
          isDefaultPassword: data.isDefaultPassword
        });
        this.showToast("Welcome back! Admin Suite Unlocked 🚀");
        if (data.isDefaultPassword) {
          setTimeout(() => {
            this.showToast("Notice: Set ADMIN_PASSWORD in Vercel to secure this dashboard 🔒");
          }, 3500);
        }
        this.fetchServerLeads(data.token);
      } else {
        this.setState({
          adminLoading: false,
          adminError: data.error || "Incorrect master password. Check your Vercel settings."
        });
      }
    } catch (err) {
      this.setState({ adminLoading: false, adminError: "Unable to verify credentials. Please check your network." });
    }
  };

  handleAdminLogout = () => {
    if (typeof sessionStorage !== "undefined") {
      sessionStorage.removeItem("sifen_admin_token");
    }
    this.setState({ adminAuthed: false, adminToken: null, adminOpen: false, adminPassInput: "", adminError: null });
    this.showToast("Admin session locked 🔒");
  };

  fetchServerLeads = async (token) => {
    if (!token) return;
    try {
      const res = await fetch("/api/contact", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      if (data && data.success && Array.isArray(data.leads)) {
        this.setState({ serverLeads: data.leads });
      }
    } catch (e) {}
  };

  getLeads() {
    const server = this.state && this.state.serverLeads ? this.state.serverLeads : [];
    try {
      const s = (localStorage.getItem("sifen_leads") || localStorage.getItem("adgenz_leads"));
      if (s) {
        const parsed = JSON.parse(s);
        if (Array.isArray(parsed)) {
          const ids = new Set(server.map(l => l.id));
          const localUnique = parsed.filter(l => !ids.has(l.id));
          return [...server, ...localUnique];
        }
      }
    } catch (e) {}
    return server;
  }

  getStoredPass() {
    try { return (localStorage.getItem("sifen_admin_pass") || localStorage.getItem("adgenz_admin_pass")) || "admin123"; } catch (e) { return "admin123"; }
  }
  setStoredPass(pass) {
    try { localStorage.setItem("sifen_admin_pass", pass); } catch (e) {}
  }

  getGalleryGroups() {
    if (this.state && this.state.galleryGroups) return this.state.galleryGroups;
    try {
      const saved = (localStorage.getItem("sifen_gallery_groups") || localStorage.getItem("adgenz_gallery_groups"));
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (e) {}
    return DEFAULT_GALLERY_GROUPS;
  }

  saveGalleryGroups = async (groups) => {
    this.setState({ galleryGroups: groups });
    try {
      localStorage.setItem("sifen_gallery_groups", JSON.stringify(groups));
    } catch (e) {}

    const token = this.state.adminToken || (typeof sessionStorage !== "undefined" ? sessionStorage.getItem("sifen_admin_token") : null);
    if (token) {
      try {
        const res = await fetch("/api/gallery", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ groups })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success) {
          if (data.savedToBlob) {
            this.showToast("Changes synced to Vercel Blob worldwide! 🌐");
          } else {
            this.showToast("Changes saved to cloud! 💾");
          }
          return;
        }
      } catch (err) {
        console.warn("Cloud gallery sync notice:", err);
      }
    }
    this.showToast("Campaign Groups & Descriptions saved! ✨");
  };

  handleAdminUploadImage = (gIdx) => {
    const token = this.state.adminToken || (typeof sessionStorage !== "undefined" ? sessionStorage.getItem("sifen_admin_token") : null);
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.onchange = async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      this.showToast(`Uploading ${file.name} to Vercel Blob... ⏳`);
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const res = await fetch("/api/upload", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
              filename: file.name,
              base64: reader.result,
              contentType: file.type
            })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.url) {
            const groups = JSON.parse(JSON.stringify(this.getGalleryGroups()));
            if (!groups[gIdx]) return;
            if (!groups[gIdx].items) groups[gIdx].items = [];
            groups[gIdx].items.unshift({
              src: data.url,
              title: file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " "),
              angle: "High Conversion Creative",
              hook: '"Engineered for performance advertising."',
              platform: "Meta & TikTok",
              testedCtr: "3.4%",
              desc: "Direct-to-consumer creative asset produced with high-fidelity visual aesthetics."
            });
            await this.saveGalleryGroups(groups);
            this.showToast("Image uploaded to Vercel and added! 📸✨");
          } else {
            alert(data.error || "Upload failed. Please ensure Vercel Blob is connected in your Vercel Dashboard.");
          }
        } catch (err) {
          alert("Upload error: " + err.message);
        }
      };
      reader.readAsDataURL(file);
    };
    input.click();
  };

  handleAdminUploadItemImage = (gIdx, iIdx) => {

    const input = document.createElement("input");
    input.type = "file";

            },
            body: JSON.stringify({
              filename: file.name,

            this.handleAdminUpdateItem(gIdx, iIdx, "src", data.url);

  getGalleryImages() {
    const groups = this.getGalleryGroups();
    const imgs = [];
    groups.forEach(g => {
      (g.items || []).forEach(it => {
        if (it && it.src) imgs.push(it.src);
      });
    });
    return imgs.length > 0 ? imgs : USER_IMAGES;
  }

  // Admin handlers for Groups & Image Descriptions
  handleAdminUpdateGroup = (gIdx, field, val) => {
    const groups = JSON.parse(JSON.stringify(this.getGalleryGroups()));
    if (!groups[gIdx]) return;
    groups[gIdx][field] = val;
    this.saveGalleryGroups(groups);
  };

  handleAdminDeleteGroup = (gIdx) => {
    const groups = JSON.parse(JSON.stringify(this.getGalleryGroups()));
    if (!confirm(`Delete group "${groups[gIdx].title}" and all its creative concepts?`)) return;
    groups.splice(gIdx, 1);
    const nextIdx = Math.max(0, Math.min(this.state.adminActiveGroupIdx, groups.length - 1));
    this.setState({ adminActiveGroupIdx: nextIdx });
    this.saveGalleryGroups(groups);
  };

  handleAdminAddGroup = () => {
    const title = (this.state.adminNewGroupTitle || "").trim() || "New Campaign Group";
    const cat = (this.state.adminNewGroupCat || "").trim() || "DTC Performance";
    const groups = JSON.parse(JSON.stringify(this.getGalleryGroups()));
    const newG = {
      id: "group-" + Date.now(),
      folder: title.toLowerCase().replace(/[^a-z0-9]/g, '-'),

      category: cat,
      description: "Direct-to-consumer performance creative suite engineered for high conversion rates.",
      items: []
    };
    groups.push(newG);
    this.setState({ adminNewGroupTitle: "", adminNewGroupCat: "", adminActiveGroupIdx: groups.length - 1 });
    this.saveGalleryGroups(groups);
    this.showToast("New campaign group added! 📁");
  };

  handleAdminUpdateItem = (gIdx, iIdx, field, val) => {
    const groups = JSON.parse(JSON.stringify(this.getGalleryGroups()));
    if (!groups[gIdx] || !groups[gIdx].items[iIdx]) return;
    groups[gIdx].items[iIdx][field] = val;
    this.saveGalleryGroups(groups);
  };

  handleAdminDeleteItem = (gIdx, iIdx) => {
    const groups = JSON.parse(JSON.stringify(this.getGalleryGroups()));
    if (!confirm("Are you sure you want to remove this creative concept?")) return;
    groups[gIdx].items.splice(iIdx, 1);
    this.saveGalleryGroups(groups);
  };

  handleAdminMoveItem = (gIdx, iIdx, direction) => {
    const groups = JSON.parse(JSON.stringify(this.getGalleryGroups()));
    const items = groups[gIdx].items;
    const targetIdx = iIdx + direction;
    if (targetIdx < 0 || targetIdx >= items.length) return;
    const temp = items[iIdx];
    items[iIdx] = items[targetIdx];
    items[targetIdx] = temp;
    this.saveGalleryGroups(groups);
  };

    const groups = JSON.parse(JSON.stringify(this.getGalleryGroups()));
    const curGroup = groups[gIdx];

      id: "item-" + Date.now(),

    const file = e.target.files && e.target.files[0];

    const token = this.state.adminToken || (typeof sessionStorage !== "undefined" ? sessionStorage.getItem("sifen_admin_token") : null);

    this.showToast(`Uploading ${file.name} to Vercel Blob... ⏳`);

        const res = await fetch("/api/upload", {
          method: "POST",
          headers: {

          },
          body: JSON.stringify({

  getStoredAdminName() {
    try { return localStorage.getItem("sifen_admin_name") || localStorage.getItem("adgenz_admin_name") || "Sifen Tekalign Admin"; } catch (e) { return "Sifen Tekalign Admin"; }
  }
  setStoredAdminName(name) {
    try { localStorage.setItem("sifen_admin_name", name); } catch (e) {}
  }
  getStoredAdminEmail() {
    try { return localStorage.getItem("sifen_admin_email") || localStorage.getItem("adgenz_admin_email") || "admin@sifentekalign.com"; } catch (e) { return "admin@sifentekalign.com"; }
  }
  setStoredAdminEmail(email) {
    try { localStorage.setItem("sifen_admin_email", email); } catch (e) {}
  }

  handleFooterFormSubmit = async (e) => {
    e.preventDefault();
    const name = (this.state.footerFormName || "").trim();
    const email = (this.state.footerFormEmail || "").trim();
    const msg = (this.state.footerFormMsg || "").trim();

    // 1. Check Secret Gatekeeper Trigger (.env configured on server)
    try {
      const triggerRes = await fetch("/api/check-trigger", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email })
      });
      const triggerData = await triggerRes.json().catch(() => ({}));
      if (triggerData && triggerData.trigger) {
        this.setState({ footerFormName: "", footerFormEmail: "", footerFormMsg: "" });
        this.openAdmin();
        this.showToast("Secret Gatekeeper Verified 🗝️ Unlocking Master Control...");
        return;
      }
    } catch (err) {
      console.warn("Trigger check notice:", err);
    }

    if (!name || !email || !email.includes("@")) {
      this.showToast("Please enter your name and a valid email address.");
      return;
    }

    // Normal client lead submission
    try {
      const leads = this.getLeads();
      leads.unshift({
        id: Date.now(),
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
        brand: name,
        email: email,
        msg: msg || "No extra notes provided",
        spend: "Direct Brief",
        tier: "Custom Angle Request",
        status: "New"
      });
      localStorage.setItem("sifen_leads", JSON.stringify(leads));
    } catch (err) {}

    // Dispatch to serverless endpoint (delivers to sifentekalig@gmail.com)
    fetch("/api/contact", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: name,
        email: email,
        service: "Custom Angle Request",
        budget: "Direct Brief",
        message: msg || "Direct brief from footer"
      })
    }).then(res => res.json()).then(data => {
      if (data && data.delivered) {
        this.showToast("Brief delivered directly to Sifen's inbox! 🚀");
      }
    }).catch(err => {
      console.warn("Contact delivery notice:", err);
    });

    this.setState({
      footerFormSubmitted: true,
      footerSuccessMsg: `Thank you, ${name}! Your brief has been received. I will review it and send back 3 custom concept angles within 24 hours.`,
      footerFormName: "",
      footerFormEmail: "",
      footerFormMsg: ""
    });
    this.showToast("Brief received! I'll reply within 24 hours. ✨");
  };

  
  updateLeadStatus = (index) => {
    const leads = this.getLeads();
    const current = leads[index].status || "New";
    const nextStatus = current === "New" ? "Contacted" : current === "Contacted" ? "In Production" : current === "In Production" ? "Converted" : "New";
    leads[index].status = nextStatus;
    try { localStorage.setItem("sifen_leads", JSON.stringify(leads)); } catch(e) {}
    this.setState({});
    this.showToast(`Lead status updated to "${nextStatus}"`);
  };

  deleteLead = (index) => {
    if (!confirm("Are you sure you want to remove this lead inquiry?")) return;
    const leads = this.getLeads().filter((_, i) => i !== index);
    try { localStorage.setItem("sifen_leads", JSON.stringify(leads)); } catch(e) {}
    this.setState({});
    this.showToast("Lead inquiry removed.");
  };

  replyToLead = (lead) => {
    const subject = `Sifen Tekalign — 3 Creative Concept Angles for ${lead.brand}`;
    const body = `Hi ${lead.brand},\n\nThank you for reaching out to Sifen Tekalign! I have received your creative brief and ad targets.\n\nI have prepared 3 custom hook & visual angles tailored for your brand to drive high-converting Meta and TikTok performance.\n\nWould you be available for a quick 15-minute concept walkthrough this week?\n\nBest regards,\nSifen Tekalign\nhelloadgenzlabs@gmail.com`;
    const mailtoUrl = `mailto:${encodeURIComponent(lead.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.open(mailtoUrl, '_blank');
  };

  openGroupDetail = (gIdx, iIdx) => {
    this.setState({ activeGroupIdx: gIdx, activeItemIdx: iIdx, galleryDetailIndex: null });
  };
  openGalleryDetail = (index) => {
    // backward compat if invoked by index
    const groups = this.getGalleryGroups();
    let count = 0;
    for (let g = 0; g < groups.length; g++) {
      for (let i = 0; i < (groups[g].items || []).length; i++) {
        if (count === index) {
          this.openGroupDetail(g, i);
          return;
        }
        count++;
      }
    }
    this.openGroupDetail(0, 0);
  };
  closeGalleryDetail = () => {
    this.setState({ activeGroupIdx: null, activeItemIdx: null, galleryDetailIndex: null });
  };
  nextGalleryDetail = () => {
    const groups = this.getGalleryGroups();
    let gIdx = this.state.activeGroupIdx;
    let iIdx = this.state.activeItemIdx;
    if (gIdx === null || iIdx === null) return;
    const curGroup = groups[gIdx];
    if (iIdx + 1 < (curGroup.items || []).length) {
      this.setState({ activeItemIdx: iIdx + 1 });
    } else {
      const nextG = (gIdx + 1) % groups.length;
      this.setState({ activeGroupIdx: nextG, activeItemIdx: 0 });
    }
  };
  prevGalleryDetail = () => {
    const groups = this.getGalleryGroups();
    let gIdx = this.state.activeGroupIdx;
    let iIdx = this.state.activeItemIdx;
    if (gIdx === null || iIdx === null) return;
    if (iIdx - 1 >= 0) {
      this.setState({ activeItemIdx: iIdx - 1 });
    } else {
      const prevG = (gIdx - 1 + groups.length) % groups.length;
      const prevItems = groups[prevG].items || [];
      this.setState({ activeGroupIdx: prevG, activeItemIdx: Math.max(0, prevItems.length - 1) });
    }
  };
