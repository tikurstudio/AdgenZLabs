<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1c1f"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" stroke="rgba(229, 185, 106, 0.4)" stroke-width="1.5"/>
  <g transform="translate(32, 32)" filter="url(#glow)">
    <!-- 8 ray Sifen Tekalign Star Logo -->
    <line x1="0" y1="0" x2="0" y2="-21" stroke="#E5B96A" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="21" stroke="#E5B96A" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-21" y2="0" stroke="#E5B96A" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="21" y2="0" stroke="#E5B96A" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-14.8" y2="-14.8" stroke="#F2D338" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14.8" y2="-14.8" stroke="#F2D338" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-14.8" y2="14.8" stroke="#F2D338" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="14.8" y2="14.8" stroke="#F2D338" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.8" fill="#FFFFFF"/>
  </g>
</svg>